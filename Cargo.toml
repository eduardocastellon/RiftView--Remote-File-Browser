[package]
name = "riftview-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
cap-std = "4.0.3"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
futures-util = "0.3.34"
getrandom = "0.3"
hmac = "0.12"
mime_guess = "2.0.5"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
spake2 = "0.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["json"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
